<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My IP</title>
<meta name="theme-color" content="#1976d2">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<script>
(function () {
  var d = document.documentElement, s = d.style;
  function g(k, f) { try { var v = localStorage.getItem('ipv.' + k); return v == null ? f : v; } catch (e) { return f; } }

  }

</script>

<style>
  @property --r  { syntax: '<length>'; inherits: true; initial-value: 4px; }
  @property --sk { syntax: '<number>'; inherits: true; initial-value: 1; }
  @property --fs { syntax: '<number>'; inherits: true; initial-value: 1; }

  [data-accent="blue"]   { --a-l:#1976d2; --a-d:#90caf9; }
  [data-accent="indigo"] { --a-l:#3f51b5; --a-d:#9fa8da; }
  [data-accent="teal"]   { --a-l:#00796b; --a-d:#80cbc4; }
  [data-accent="green"]  { --a-l:#388e3c; --a-d:#a5d6a7; }
  [data-accent="orange"] { --a-l:#e65100; --a-d:#ffcc80; }
  [data-accent="red"]    { --a-l:#d32f2f; --a-d:#ef9a9a; }
  [data-accent="pink"]   { --a-l:#c2185b; --a-d:#f48fb1; }
  [data-accent="purple"] { --a-l:#7b1fa2; --a-d:#ce93d8; }

  html {
    --bg:#eeeeee; --surface:#ffffff;
    --text:rgba(0,0,0,.87); --text2:rgba(0,0,0,.6); --divider:rgba(0,0,0,.12);
    --primary:var(--a-l); --on-primary:#fff;
    --appbar:var(--a-l); --on-appbar:#fff; --prog:#fff;
    --field:rgba(0,0,0,.06); --field-h:rgba(0,0,0,.09); --field-line:rgba(0,0,0,.42);
    --skel:#e0e0e0; --err:#b00020; --snack:#323232; --on-snack:#fff; --thumb:#fafafa;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    --bg:#121212; --surface:#1e1e1e;
    --text:rgba(255,255,255,.87); --text2:rgba(255,255,255,.6); --divider:rgba(255,255,255,.12);
    --primary:var(--a-d); --on-primary:rgba(0,0,0,.87);
    --appbar:#272727; --on-appbar:#fff; --prog:var(--a-d);
    --field:rgba(255,255,255,.06); --field-h:rgba(255,255,255,.09); --field-line:rgba(255,255,255,.42);
    --skel:#333; --err:#cf6679; --snack:#e0e0e0; --on-snack:rgba(0,0,0,.87); --thumb:#bdbdbd;
    color-scheme: dark;
  }
  html[data-theme="dark"][data-black="1"] { --bg:#000; --surface:#0d0d0d; --appbar:#0d0d0d; }
  html[data-theme="dark"][data-vivid="1"] { --primary:var(--a-l); --on-primary:#fff; --prog:var(--a-l); }

  :root {
    --r: 4px;
    --sk: 1;
    --fs: 1;
    --row: 48px; --pad: 12px;
    --font: Roboto, "Helvetica Neue", Arial, sans-serif;
    --ease: cubic-bezier(.4,0,.2,1);
    --ease-dec: cubic-bezier(0,0,.2,1);
    --ease-acc: cubic-bezier(.4,0,1,1);
    --e1: 0 2px 1px -1px rgba(0,0,0,calc(.2*var(--sk))), 0 1px 1px 0 rgba(0,0,0,calc(.14*var(--sk))), 0 1px 3px 0 rgba(0,0,0,calc(.12*var(--sk)));
    --e4: 0 2px 4px -1px rgba(0,0,0,calc(.2*var(--sk))), 0 4px 5px 0 rgba(0,0,0,calc(.14*var(--sk))), 0 1px 10px 0 rgba(0,0,0,calc(.12*var(--sk)));
    --e8: 0 5px 5px -3px rgba(0,0,0,calc(.2*var(--sk))), 0 8px 10px 1px rgba(0,0,0,calc(.14*var(--sk))), 0 3px 14px 2px rgba(0,0,0,calc(.12*var(--sk)));
    --e24: 0 11px 15px -7px rgba(0,0,0,calc(.2*var(--sk))), 0 24px 38px 3px rgba(0,0,0,calc(.14*var(--sk))), 0 9px 46px 8px rgba(0,0,0,calc(.12*var(--sk)));
  }
  html[data-density="compact"]     { --row: 36px; --pad: 6px; }
  html[data-density="comfortable"] { --row: 60px; --pad: 16px; }
  html[data-font="system"] { --font: system-ui, -apple-system, "Segoe UI", sans-serif; }
  html[data-font="mono"]   { --font: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }

  * { box-sizing: border-box; }
  html { background: var(--bg); font-size: calc(100% * var(--fs)); transition: --r .25s var(--ease), --sk .25s var(--ease), --fs .25s var(--ease); }
  body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); line-height: 1.5; }

  @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes rowIn  { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes swap   { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes errIn  { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes icoIn  { from { opacity: 0; transform: rotate(-90deg) scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes pulse  { 50% { opacity: .5; } }
  @keyframes fade   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dlgIn  { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes dlgOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(.8); } }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  @keyframes ind1 { 0% { left: -35%; right: 100%; } 60% { left: 100%; right: -90%; } 100% { left: 100%; right: -90%; } }
  @keyframes ind2 { 0% { left: -200%; right: 100%; } 60% { left: 107%; right: -8%; } 100% { left: 107%; right: -8%; } }

  html.theming, html.theming *, html.theming *::before, html.theming *::after {
    transition: background-color .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease),
                box-shadow .3s var(--ease), fill .3s var(--ease) !important;
  }

  .appbar {
    position: sticky; top: 0; z-index: 10; height: 56px; padding: 0 8px 0 16px;
    display: flex; align-items: center; gap: 16px;
    background: var(--appbar); color: var(--on-appbar); box-shadow: var(--e4);
    font-size: 1.25rem; font-weight: 500; letter-spacing: .15px;
  }
  .appbar .title { flex: 1; }
  svg.i { width: 24px; height: 24px; fill: currentColor; flex: none; }
  svg.ico-in { animation: icoIn .3s var(--ease-dec); }
  @media (min-width: 600px) { .appbar { height: 64px; padding: 0 16px 0 24px; } }

  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; overflow: hidden; opacity: 0; pointer-events: none;
    background: color-mix(in srgb, var(--prog) 25%, transparent); transition: opacity .2s var(--ease); }
  .progress.on { opacity: 1; }
  .progress::before, .progress::after { content: ""; position: absolute; top: 0; bottom: 0; background: var(--prog); }
  .progress.on::before { animation: ind1 2.1s cubic-bezier(.65,.815,.735,.395) infinite; }
  .progress.on::after  { animation: ind2 2.1s cubic-bezier(.165,.84,.44,1) 1.15s infinite; }

  .icon-btn {
    position: relative; overflow: hidden; width: 48px; height: 48px; border: 0; padding: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; background: transparent; color: inherit;
    transition: background-color .15s var(--ease);
  }
  .icon-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
  .icon-btn:focus-visible, .btn:focus-visible, .swatch:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .appbar .icon-btn:focus-visible { outline-color: var(--on-appbar); }

  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  @media (min-width: 600px) { main { padding: 24px; } }

  .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--e1); margin-bottom: 16px; overflow: hidden;
    animation: cardIn .3s var(--ease-dec) both; animation-delay: calc(var(--i, 0) * 45ms); }
  .card-title { padding: 16px 16px 0; font-size: 1.25rem; font-weight: 500; letter-spacing: .15px; }
  .card-sub { padding: 0 16px; color: var(--text2); font-size: .875rem; }
  .card-actions { padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card-actions:empty { padding: 4px; }

  .hero { background: var(--primary); color: var(--on-primary); box-shadow: var(--e4); padding: 24px 16px 8px; }
  .hero .label { font-size: .875rem; opacity: .8; }
  .hero .ip { font-size: clamp(1.75rem, 7vw, 3rem); margin: 4px 0; word-break: break-all; }
  .hero .meta { font-size: .875rem; opacity: .85; min-height: 1.3em; }
  .hero .card-actions { padding: 8px 0; margin-left: -8px; }
  .hero .btn { color: inherit; }
  .hero .btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
  html[data-hero="surface"] .hero { background: var(--surface); color: var(--text); }
  html[data-hero="surface"] .hero .ip { color: var(--primary); }
  html[data-hero="surface"] .hero .btn { color: var(--primary); }
  html[data-hero="surface"] .hero .btn:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }

  .swap { animation: swap .3s var(--ease-dec); }

  .btn {
    position: relative; overflow: hidden; display: inline-block; text-decoration: none;
    min-width: 64px; height: 36px; padding: 0 16px; border: 0; border-radius: var(--r); cursor: pointer;
    font: 500 .875rem/36px var(--font); text-transform: uppercase; letter-spacing: 1.25px;
    background: transparent; color: var(--primary);
    transition: background-color .15s var(--ease), box-shadow .28s var(--ease), filter .15s var(--ease);
  }
  .btn:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .btn.raised { background: var(--primary); color: var(--on-primary); box-shadow: var(--e1); }
  .btn.raised:hover { filter: brightness(.92); box-shadow: var(--e4); }
  .btn.raised:active { box-shadow: var(--e8); }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .ripple { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .25; transform: scale(0); animation: ripple .45s var(--ease-dec) forwards; }

  .list { list-style: none; margin: 8px 0 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 16px; padding: var(--pad) 16px; min-height: var(--row); border-top: 1px solid var(--divider); transition: padding .2s var(--ease), min-height .2s var(--ease); }
  .list li:first-child { border-top: 0; }
  .list li.enter { animation: rowIn .25s var(--ease-dec) both; animation-delay: calc(var(--n, 0) * 30ms); }
  .list .k { color: var(--text2); flex: 0 0 40%; }
  .list .v { text-align: right; word-break: break-word; }
  .skeleton { color: transparent; background: var(--skel); border-radius: 2px; animation: pulse 1.2s infinite; user-select: none; }

  .field { position: relative; margin: 16px 16px 28px; background: var(--field); border-radius: var(--r) var(--r) 0 0; border-bottom: 1px solid var(--field-line); transition: background-color .15s var(--ease); }
  .field:hover, .field:focus-within { background: var(--field-h); }
  .field::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); transform: scaleX(0); transition: transform .2s var(--ease); }
  .field:focus-within::after { transform: scaleX(1); }
  .field label { position: absolute; left: 16px; top: 18px; font-size: 1rem; color: var(--text2); pointer-events: none; transform-origin: left top; transition: transform .15s var(--ease), color .15s var(--ease); }
  .field:focus-within label, .field:has(input:not(:placeholder-shown)) label { transform: translateY(-10px) scale(.75); }
  .field:focus-within label { color: var(--primary); }
  .field input { width: 100%; height: 56px; padding: 24px 16px 6px; border: 0; background: transparent; outline: 0; font: 400 1rem var(--font); color: var(--text); }
  .field input::placeholder { color: transparent; transition: color .15s var(--ease); }
  .field:focus-within input::placeholder { color: var(--text2); }
  .field .helper { position: absolute; top: 100%; left: 16px; padding-top: 4px; font-size: .75rem; color: var(--err); opacity: 0; transform: translateY(-4px); transition: opacity .15s var(--ease), transform .15s var(--ease); }
  .field.error { border-bottom-color: var(--err); }
  .field.error::after { background: var(--err); transform: scaleX(1); }
  .field.error label { color: var(--err); }
  .field.error .helper { opacity: 1; transform: none; }
  .lookup .card-actions { margin-top: -12px; }

  .error-card { border-left: 4px solid var(--err); padding: 16px; color: var(--err); display: none; }
  .error-card.show { display: block; animation: errIn .25s var(--ease-dec); }

  dialog {
    border: 0; padding: 0; border-radius: var(--r); box-shadow: var(--e24); background: var(--surface); color: var(--text); font: inherit;
    width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: hidden; flex-direction: column;
  }
  dialog[open] { display: flex; animation: dlgIn .225s var(--ease-dec) both; }
  dialog.closing { animation: dlgOut .195s var(--ease-acc) both; }
  dialog[open]::backdrop { background: rgba(0,0,0,.32); animation: fade .225s var(--ease-dec) both; }
  dialog.closing::backdrop { animation: fade .195s var(--ease-acc) reverse both; }
  .dlg-title { padding: 20px 24px 12px; font-size: 1.25rem; font-weight: 500; letter-spacing: .15px; }
  .dlg-body { padding: 0 24px 8px; overflow-y: auto; }
  .dlg-actions { padding: 8px; display: flex; justify-content: space-between; border-top: 1px solid var(--divider); }
  .group-title { font-size: .875rem; font-weight: 500; color: var(--text2); margin: 16px 0 4px; }
  .dlg-sub { font-size: .875rem; font-weight: 500; color: var(--primary); margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--divider); }
  .opts { display: flex; flex-wrap: wrap; gap: 0 24px; }

  .opt { display: flex; align-items: center; gap: 12px; min-height: 40px; cursor: pointer; }
  .opt input { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; margin: 0; border: 2px solid var(--text2); border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease); }
  .opt input::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); transform: scale(0); transition: transform .15s var(--ease); }
  .opt input:checked { border-color: var(--primary); }
  .opt input:checked::before { transform: scale(1); }
  .opt:hover input { box-shadow: 0 0 0 10px color-mix(in srgb, var(--text) 6%, transparent); }
  .opt input:focus-visible { box-shadow: 0 0 0 10px color-mix(in srgb, var(--primary) 20%, transparent); outline: 0; }

  .sw { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; margin-top: 8px; cursor: pointer; }
  .sw input { -webkit-appearance: none; appearance: none; position: relative; flex: none; width: 36px; height: 14px; margin: 0 4px; border-radius: 7px; cursor: pointer;
    background: color-mix(in srgb, var(--text) 38%, transparent); transition: background-color .15s var(--ease); }
  .sw input::before { content: ""; position: absolute; left: -3px; top: -3px; width: 20px; height: 20px; border-radius: 50%; background: var(--thumb); box-shadow: var(--e1);
    transition: transform .15s var(--ease), background-color .15s var(--ease); }
  .sw input:checked { background: color-mix(in srgb, var(--primary) 50%, transparent); }
  .sw input:checked::before { transform: translateX(22px); background: var(--primary); }
  .sw input:focus-visible { outline: 2px solid var(--primary); outline-offset: 6px; }

  .rng { margin-top: 16px; }
  .rng-head { display: flex; justify-content: space-between; font-size: .875rem; color: var(--text2); font-weight: 500; }
  .rng-head output { color: var(--text); font-weight: 400; }
  .slider { display: flex; align-items: center; height: 28px; cursor: pointer; touch-action: none; outline: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  .slider .track { position: relative; flex: 1; height: 2px; background: color-mix(in srgb, var(--primary) 26%, transparent); }
  .slider .fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: var(--primary); transition: width .25s var(--ease); }
  .slider .thumb { position: absolute; top: 50%; left: var(--p, 0%); width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--primary); transition: left .25s var(--ease), transform .15s var(--ease); }
  .slider .thumb::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: color-mix(in srgb, var(--primary) 20%, transparent); transform: scale(0); transition: transform .2s var(--ease); }
  .slider:hover .thumb::before, .slider.active .thumb::before, .slider:focus-visible .thumb::before { transform: scale(1); }
  .slider.active .thumb { transform: scale(1.15); }
  .slider.dragging .fill, .slider.dragging .thumb { transition: none; }

  .swatches { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 0 4px; }
  .swatch { position: relative; width: 40px; height: 40px; border: 0; padding: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center;
    background: var(--a-l); color: #fff; box-shadow: var(--e1); transition: box-shadow .28s var(--ease), transform .15s var(--ease); }
  .swatch:hover { box-shadow: var(--e4); }
  .swatch:active { transform: scale(.92); }
  html[data-theme="dark"] .swatch { background: var(--a-d); color: rgba(0,0,0,.87); }
  html[data-theme="dark"][data-vivid="1"] .swatch { background: var(--a-l); color: #fff; }
  html .swatch.custom, html[data-theme="dark"] .swatch.custom { background: conic-gradient(#f44336, #ffeb3b, #4caf50, #00bcd4, #3f51b5, #e91e63, #f44336); color: #fff; }
  .swatch.custom svg { filter: drop-shadow(0 0 2px rgba(0,0,0,.7)); }
  .swatch.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
  .swatch svg { width: 20px; height: 20px; fill: currentColor; transform: scale(0); transition: transform .15s var(--ease-dec); pointer-events: none; }
  .swatch[aria-checked="true"] svg { transform: scale(1); }

  .snackbar {
    position: fixed; left: 50%; bottom: 24px; z-index: 20; transform: translate(-50%, 100px); opacity: 0;
    min-width: 288px; max-width: calc(100vw - 32px); padding: 14px 16px; border-radius: var(--r);
    background: var(--snack); color: var(--on-snack); font-size: .875rem; box-shadow: var(--e8);
    transition: transform .075s var(--ease-acc), opacity .075s var(--ease-acc);
  }
  .snackbar.show { transform: translate(-50%, 0); opacity: 1; transition: transform .15s var(--ease-dec), opacity .15s var(--ease-dec); }

  footer { text-align: center; color: var(--text2); font-size: .75rem; padding: 8px 16px 32px; }

  html[data-anim="off"], html[data-anim="off"] *, html[data-anim="off"] *::before, html[data-anim="off"] *::after,
  html[data-anim="off"] dialog::backdrop { animation: none !important; transition: none !important; }
</style>
</head>

<header class="appbar">
  <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.9 6h-2.95a15.7 15.7 0 00-1.38-3.56A8.03 8.03 0 0118.9 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14a8.2 8.2 0 010-4h3.38a16.5 16.5 0 000 4H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.99 7.99 0 015.08 16zm2.95-8H5.08a7.99 7.99 0 014.33-3.56A15.7 15.7 0 008.03 8zM12 19.96A14.1 14.1 0 0110.09 16h3.82A14.1 14.1 0 0112 19.96zM14.34 14H9.66a14.7 14.7 0 010-4h4.68a14.7 14.7 0 010 4zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 01-4.33 3.56zM16.36 14a16.5 16.5 0 000-4h3.38a8.2 8.2 0 010 4h-3.38z"/></svg>
  <span class="title" data-i18n="app.title"></span>
  <button class="icon-btn" id="themeBtn" data-i18n-aria="theme.toggle"></button>
  <button class="icon-btn" id="settingsBtn" data-i18n-aria="settings">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
  </button>

<script src="lang/en.js"></script>
<script src="lang/ru.js"></script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const LANGS = window.LANGS;
  const DEFAULT_LANG = 'en';
  const ACCENTS = ['blue', 'indigo', 'teal', 'green', 'orange', 'red', 'pink', 'purple'];
  const THEMES = ['system', 'light', 'dark'];
  const OPTS = {
    anim: ['system', 'on', 'off'],
    density: ['compact', 'default', 'comfortable'],
    font: ['roboto', 'system', 'mono'],
    hero: ['accent', 'surface'],
  };
  const RANGES = { radius: [0, 24, 2, 'px'], shadow: [0, 200, 10, '%'], fs: [85, 130, 5, '%'] };
  const DEF = { lang: 'auto', theme: 'system', accent: 'blue', custom: '#6200ee', anim: 'system',
                radius: 4, shadow: 100, fs: 100, density: 'default', font: 'roboto', hero: 'accent', black: false, vivid: false };

  const store = {
    get(k) { try { return localStorage.getItem('ipv.' + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem('ipv.' + k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem('ipv.' + k); } catch (e) {} },
  };
  function readPrefs() {
    const p = { ...DEF }, raw = k => store.get(k);
    if (LANGS[raw('lang')]) p.lang = raw('lang');
    if (THEMES.includes(raw('theme'))) p.theme = raw('theme');
    if ([...ACCENTS, 'custom'].includes(raw('accent'))) p.accent = raw('accent');
    if (/^#[0-9a-f]{6}$/i.test(raw('custom') || '')) p.custom = raw('custom');
    for (const k of Object.keys(OPTS)) if (OPTS[k].includes(raw(k))) p[k] = raw(k);
    for (const k of Object.keys(RANGES)) {
      const n = Number(raw(k));
      if (raw(k) != null && isFinite(n)) p[k] = Math.min(RANGES[k][1], Math.max(RANGES[k][0], n));
    }
    p.black = raw('black') === '1';
    p.vivid = raw('vivid') === '1';
    return p;
  }
  const prefs = readPrefs();
  const save = k => store.set(k, typeof prefs[k] === 'boolean' ? (prefs[k] ? '1' : '0') : String(prefs[k]));

  function detectLang() {
    const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for (const tag of list) {
      const l = String(tag).toLowerCase();
      if (LANGS[l]) return l;
      const base = l.split('-')[0];
      if (LANGS[base]) return base;
    }
    return DEFAULT_LANG;
  }
  let lang = DEFAULT_LANG;
  const resolveLang = () => (prefs.lang !== 'auto' && LANGS[prefs.lang]) ? prefs.lang : detectLang();

  function t(key, vars) {
    let s = LANGS[lang].strings[key];
    if (s == null) s = LANGS[DEFAULT_LANG].strings[key];
    if (s == null) return key;
    return vars ? s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? vars[k] : m)) : s;
  }

  function applyStatic() {
    root.lang = lang;
    document.title = t('app.title');
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(e => {
      const s = t(e.dataset.i18nAria);
      e.setAttribute('aria-label', s);
      if (e.tagName === 'BUTTON' || e.classList.contains('swatch')) e.title = s;
    });
  }

  const mq = matchMedia('(prefers-color-scheme: dark)');
  const mqMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const ICON_MOON = '<path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 01-4.4 2.26 5.4 5.4 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
  const ICON_SUN = '<path d="M12 8a4 4 0 100 8 4 4 0 000-8zM11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM17.7 4.2l1.4 1.4-2.1 2.1-1.4-1.4zM5.6 19.8l-1.4-1.4 2.1-2.1 1.4 1.4z"/>';
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';

  const resolveTheme = () => prefs.theme === 'system' ? (mq.matches ? 'dark' : 'light') : prefs.theme;
  const resolveAnim = () => prefs.anim === 'system' ? (mqMotion.matches ? 'off' : 'on') : prefs.anim;

  const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const rgb2hex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
  const lum = a => {
    const f = v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); };
    return .2126 * f(a[0]) + .7152 * f(a[1]) + .0722 * f(a[2]);
  };
  const onColor = a => { const L = lum(a) + .05; return 1.05 / L > L / .065 ? '#fff' : 'rgba(0,0,0,.87)'; };

  function applyLook() {
    const s = root.style;
    s.setProperty('--r', prefs.radius + 'px');
    s.setProperty('--sk', prefs.shadow / 100);
    s.setProperty('--fs', prefs.fs / 100);
    root.dataset.density = prefs.density;
    root.dataset.font = prefs.font;
    root.dataset.hero = prefs.hero;
    root.dataset.black = prefs.black ? '1' : '0';
    root.dataset.vivid = prefs.vivid ? '1' : '0';
    root.dataset.anim = resolveAnim();
  }

  let lastTheme = null;
  function applyTheme() {
    const th = resolveTheme(), s = root.style;
    root.dataset.theme = th;
    root.dataset.accent = prefs.accent;
    if (prefs.accent === 'custom') {
      const l = hex2rgb(prefs.custom), d = l.map(v => v * .55 + 255 * .45);
      s.setProperty('--a-l', prefs.custom);
      s.setProperty('--a-d', rgb2hex(d));
      s.setProperty('--on-primary', onColor(th === 'dark' && !prefs.vivid ? d : l));
      if (th === 'dark') s.removeProperty('--on-appbar'); else s.setProperty('--on-appbar', onColor(l));
    } else {
      ['--a-l', '--a-d', '--on-primary', '--on-appbar'].forEach(p => s.removeProperty(p));
    }
    const btn = $('themeBtn');
    btn.innerHTML = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${th === 'dark' ? ICON_SUN : ICON_MOON}</svg>`;
    if (lastTheme && lastTheme !== th) btn.firstChild.classList.add('ico-in');
    lastTheme = th;
    const c = getComputedStyle(root).getPropertyValue('--appbar').trim();
    if (c) document.querySelector('meta[name="theme-color"]').content = c;
  }

  let themedTimer;
  function themed(fn) {
    root.classList.add('theming');
    fn();
    clearTimeout(themedTimer);
    themedTimer = setTimeout(() => root.classList.remove('theming'), 450);
  }
  mq.addEventListener('change', () => { if (prefs.theme === 'system') themed(applyTheme); });
  mqMotion.addEventListener('change', () => { if (prefs.anim === 'system') applyLook(); });

  function setPref(k, v) {
    prefs[k] = v; save(k);
    if (k === 'lang') setLang();
    else if (['theme', 'accent', 'custom', 'black', 'hero', 'vivid'].includes(k)) themed(() => { applyLook(); applyTheme(); });
    else applyLook();
    syncSettings();
  }

  const UI = [
    { t: 'settings.language',   type: 'radio', key: 'lang',  vals: () => ['auto', ...Object.keys(LANGS)], lab: v => v === 'auto' ? ['settings.language.auto'] : [null, LANGS[v].name] },
    { t: 'settings.theme',      type: 'radio', key: 'theme', vals: () => THEMES, lab: v => ['theme.' + v] },
    { t: 'settings.accent',     type: 'accent' },
    { t: 'look.vivid',          type: 'switch', key: 'vivid' },
    { t: 'settings.animations', type: 'radio', key: 'anim',  vals: () => OPTS.anim, lab: v => ['anim.' + v] },
    { t: 'settings.appearance', type: 'title' },
    { t: 'look.radius',  type: 'range', key: 'radius' },
    { t: 'look.shadow',  type: 'range', key: 'shadow' },
    { t: 'look.fs',      type: 'range', key: 'fs' },
    { t: 'look.density', type: 'radio', key: 'density', vals: () => OPTS.density, lab: v => ['density.' + v] },
    { t: 'look.font',    type: 'radio', key: 'font',    vals: () => OPTS.font,    lab: v => ['font.' + v] },
    { t: 'look.hero',    type: 'radio', key: 'hero',    vals: () => OPTS.hero,    lab: v => ['hero.' + v] },
    { t: 'look.black',   type: 'switch', key: 'black' },
  ];

  function mk(tag, cls, attrs = {}, kids = []) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    for (const k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'role' || k.startsWith('data-')) e.setAttribute(k, attrs[k]);
      else e[k] = attrs[k];
    }
    e.append(...kids);
    return e;
  }

  function buildSlider(key) {
    const [min, max, step] = RANGES[key];
    const thumb = mk('div', 'thumb');
    const fill = mk('div', 'fill');
    const track = mk('div', 'track', {}, [fill, thumb]);
    const box = mk('div', 'slider', { role: 'slider', tabIndex: 0 }, [track]);
    box.dataset.key = key;
    box.setAttribute('aria-valuemin', min);
    box.setAttribute('aria-valuemax', max);
    const valueAt = x => {
      const r = track.getBoundingClientRect();
      const f = Math.min(1, Math.max(0, (x - r.left) / r.width));
      return Math.round((min + f * (max - min)) / step) * step;
    };
    box.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      box.setPointerCapture(e.pointerId);
      box.focus({ preventScroll: true });
      box.classList.add('active');
      setPref(key, valueAt(e.clientX));
    });
    box.addEventListener('pointermove', e => {
      if (!box.hasPointerCapture(e.pointerId)) return;
      box.classList.add('dragging');
      setPref(key, valueAt(e.clientX));
    });
    const end = () => box.classList.remove('active', 'dragging');
    box.addEventListener('pointerup', end);
    box.addEventListener('pointercancel', end);
    box.addEventListener('keydown', e => {
      const d = { ArrowRight: step, ArrowUp: step, ArrowLeft: -step, ArrowDown: -step, PageUp: step * 5, PageDown: -step * 5 }[e.key];
      let v;
      if (d) v = prefs[key] + d;
      else if (e.key === 'Home') v = min;
      else if (e.key === 'End') v = max;
      else return;
      e.preventDefault();
      setPref(key, Math.min(max, Math.max(min, v)));
    });
    return box;
  }

  function buildSettings() {
    const body = $('dlgBody');
    body.replaceChildren();
    for (const u of UI) {
      if (u.type === 'title') {
        body.append(mk('div', 'dlg-sub', { 'data-i18n': u.t }));
      } else if (u.type === 'radio') {
        const box = mk('div', 'opts', { role: 'radiogroup', 'data-i18n-aria': u.t });
        for (const v of u.vals()) {
          const [k, txt] = u.lab(v);
          const inp = mk('input', '', { type: 'radio', name: u.key, value: v });
          inp.dataset.key = u.key;
          box.append(mk('label', 'opt', {}, [inp, k ? mk('span', '', { 'data-i18n': k }) : mk('span', '', { text: txt })]));
        }
        body.append(mk('div', 'group-title', { 'data-i18n': u.t }), box);
      } else if (u.type === 'accent') {
        const box = mk('div', 'swatches', { role: 'radiogroup', 'data-i18n-aria': u.t });
        ACCENTS.forEach(a => {
          const b = mk('button', 'swatch', { type: 'button', role: 'radio', 'data-accent': a, 'data-i18n-aria': 'accent.' + a });
          b.dataset.value = a; b.innerHTML = CHECK; box.append(b);
        });
        const ci = mk('input', '', { type: 'color', value: prefs.custom });
        ci.dataset.key = 'custom';
        const cb = mk('label', 'swatch custom', { role: 'radio', 'data-i18n-aria': 'accent.custom' });
        cb.dataset.value = 'custom'; cb.innerHTML = CHECK; cb.append(ci); box.append(cb);
        body.append(mk('div', 'group-title', { 'data-i18n': u.t }), box);
      } else if (u.type === 'range') {
        const sl = buildSlider(u.key);
        sl.setAttribute('data-i18n-aria', u.t);
        const out = mk('output'); out.dataset.out = u.key;
        body.append(mk('div', 'rng', {}, [mk('div', 'rng-head', {}, [mk('span', '', { 'data-i18n': u.t }), out]), sl]));
      } else if (u.type === 'switch') {
        const inp = mk('input', '', { type: 'checkbox', role: 'switch' });
        inp.dataset.key = u.key;
        body.append(mk('label', 'sw', {}, [mk('span', '', { 'data-i18n': u.t }), inp]));
      }
    }
    body.addEventListener('input', e => {
      const i = e.target, k = i.dataset.key; if (!k) return;
      if (i.type === 'color') { prefs.accent = 'custom'; save('accent'); setPref('custom', i.value); }
    });
    body.addEventListener('change', e => {
      const i = e.target, k = i.dataset.key; if (!k) return;
      if (i.type === 'radio') setPref(k, i.value);
      else if (i.type === 'checkbox') setPref(k, i.checked);
    });
    body.addEventListener('click', e => {
      const b = e.target.closest('button.swatch');
      if (b) setPref('accent', b.dataset.value);
    });
  }

  function syncSettings() {
    const body = $('dlgBody');
    body.querySelectorAll('input[data-key]').forEach(i => {
      const k = i.dataset.key;
      if (i.type === 'radio') i.checked = String(prefs[k]) === i.value;
      else if (i.type === 'checkbox') i.checked = !!prefs[k];
      else if (i.type === 'color') i.value = prefs.custom;
    });
    body.querySelectorAll('.slider').forEach(s => {
      const k = s.dataset.key, [mn, mx, , unit] = RANGES[k];
      s.style.setProperty('--p', ((prefs[k] - mn) / (mx - mn) * 100) + '%');
      s.setAttribute('aria-valuenow', prefs[k]);
      s.setAttribute('aria-valuetext', prefs[k] + unit);
      body.querySelector(`output[data-out="${k}"]`).textContent = prefs[k] + unit;
    });
    body.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-checked', String(b.dataset.value === prefs.accent)));
    body.querySelector('.swatch.custom').style.background = prefs.accent === 'custom' ? prefs.custom : '';
  }

  const dlg = $('settings');
  function openDlg() { syncSettings(); dlg.showModal(); }
  function closeDlg() {
    if (!dlg.open || dlg.classList.contains('closing')) return;
    const done = () => { dlg.classList.remove('closing'); if (dlg.open) dlg.close(); };
    if (root.dataset.anim === 'off') return done();
    dlg.classList.add('closing');
    const f = e => { if (e.target !== dlg) return; dlg.removeEventListener('animationend', f); done(); };
    dlg.addEventListener('animationend', f);
    setTimeout(done, 400);
  }

  function resetPrefs() {
    Object.keys(DEF).forEach(k => store.del(k));
    Object.assign(prefs, DEF);
    themed(() => { applyLook(); applyTheme(); });
    setLang();
    snack(t('reset.done'));
  }

  const geoRows = [
    ['row.country', d => d.country ? `${d.flag?.emoji || ''} ${d.country}`.trim() : null],
    ['row.region',  d => d.region],
    ['row.city',    d => d.city],
    ['row.postal',  d => d.postal],
    ['row.coords',  d => d.latitude != null ? `${d.latitude.toFixed(4)}, ${d.longitude.toFixed(4)}` : null],
    ['row.tz',      d => d.timezone ? `${d.timezone.id} (UTC${d.timezone.utc})` : null],
    ['row.isp',     d => d.connection?.isp],
    ['row.org',     d => d.connection?.org],
    ['row.asn',     d => d.connection?.asn ? `AS${d.connection.asn}` : null],
    ['row.domain',  d => d.connection?.domain],
    ['row.type',    d => d.type],
  ];
  const connRows = [
    ['row.ip',   d => d.ip_addr],
    ['row.host', d => d.remote_host && d.remote_host !== 'unavailable' ? d.remote_host : null],
    ['row.port', d => d.port],
    ['row.lang', d => d.language],
    ['row.enc',  d => d.encoding],
    ['row.ua',   d => d.user_agent],
  ];

  async function getJson(url, timeout = 10000) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  }

  async function getMyConnection() {
    try {
      return await getJson('https://ifconfig.me/all.json');
    } catch (e) {
      const r = await fetch('https://ifconfig.me/ip', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return { ip_addr: (await r.text()).trim() };
    }
  }

  const geoCache = new Map();
  async function getGeo(ip) {
    const gl = LANGS[lang].geoLang || '';
    const key = ip + '|' + gl;
    if (geoCache.has(key)) return geoCache.get(key);
    const d = await getJson('https://ipwho.is/' + ip + (gl ? '?lang=' + gl : ''));
    if (d.success === false) throw new Error(d.message || 'error');
    geoCache.set(key, d);
    return d;
  }

  const st = {
    me: null, mePhase: 'loading',
    myGeo: null, myGeoPhase: 'loading',
    view: { ip: '', geo: null, phase: 'loading' },
    err: null,
    fieldErr: false,
  };

  function swapText(el, txt) {
    if (el.textContent === txt) return;
    el.textContent = txt;
    el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  }

  function fillList(el, rows, data, key) {
    const animate = el.dataset.ak !== key;
    el.dataset.ak = key; el.dataset.sk = '';
    el.replaceChildren();
    let n = 0;
    for (const [rk, fn] of rows) {
      let v = null;
      try { v = fn(data); } catch (e) {}
      if (v == null || String(v).trim() === '') continue;
      const li = document.createElement('li');
      const k = document.createElement('span'); k.className = 'k'; k.textContent = t(rk);
      const val = document.createElement('span'); val.className = 'v'; val.textContent = String(v);
      li.append(k, val);
      if (animate) { li.classList.add('enter'); li.style.setProperty('--n', Math.min(n, 12)); }
      el.append(li); n++;
    }
    if (!n) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="k"></span>';
      li.firstChild.textContent = t('no.data');
      el.append(li);
    }
  }

  function clearList(el) { el.dataset.ak = ''; el.dataset.sk = ''; el.replaceChildren(); }

  function skeleton(el, count) {
    if (el.dataset.sk === '1') return;
    el.dataset.sk = '1'; el.dataset.ak = '';
    el.replaceChildren();
    for (let i = 0; i < count; i++) {
      const li = document.createElement('li');
      li.innerHTML = '<span class="k skeleton">Loading</span><span class="v skeleton">Loading data</span>';
      el.append(li);
    }
  }

  function render() {
    swapText($('ip'), st.mePhase === 'ok' ? st.me.ip_addr : st.mePhase === 'loading' ? '…' : t('err.short'));
    let meta = '';
    if (st.mePhase === 'loading') meta = t('loading');
    else if (st.mePhase === 'fail') meta = t('hero.noIp');
    else if (st.myGeoPhase === 'loading') meta = t('loading');
    else if (st.myGeoPhase === 'fail') meta = t('hero.noGeo');
    else {
      const g = st.myGeo;
      meta = [[g.city, g.country].filter(Boolean).join(', '), g.connection?.isp].filter(Boolean).join(' — ') || g.type || '';
    }
    swapText($('heroMeta'), meta);
    $('copyBtn').disabled = st.mePhase !== 'ok';
    $('refreshBtn').disabled = st.mePhase === 'loading';

    const busy = st.mePhase === 'loading' || (st.mePhase === 'ok' && st.myGeoPhase === 'loading') || st.view.phase === 'loading';
    $('progress').classList.toggle('on', busy);

    const v = st.view;
    $('geoSub').textContent = (v.ip ? t('geo.for', { ip: v.ip }) : t('geo.mine')) + ' · ' + t('source', { name: 'ipwho.is' });
    if (v.phase === 'loading') skeleton($('geoList'), 6);
    else if (v.phase === 'fail') clearList($('geoList'));
    else fillList($('geoList'), geoRows, v.geo, 'ok|' + v.ip);
    const link = $('mapLink');
    if (v.phase === 'ok' && v.geo.latitude != null) {
      link.href = `https://www.openstreetmap.org/?mlat=${v.geo.latitude}&mlon=${v.geo.longitude}#map=10/${v.geo.latitude}/${v.geo.longitude}`;
      link.hidden = false;
    } else link.hidden = true;

    $('connSub').textContent = t('source', { name: 'ifconfig.me' });
    if (st.mePhase === 'loading') skeleton($('connList'), 4);
    else if (st.mePhase === 'fail') clearList($('connList'));
    else fillList($('connList'), connRows, st.me, 'ok');

    const ec = $('errorCard');
    if (st.err) { ec.textContent = t(st.err.key, st.err.vars); ec.classList.add('show'); }
    else ec.classList.remove('show');
    $('field').classList.toggle('error', st.fieldErr);
    if (st.fieldErr) $('helper').textContent = t('err.ip.invalid');
  }

  async function load() {
    Object.assign(st, { me: null, mePhase: 'loading', myGeo: null, myGeoPhase: 'loading', err: null });
    st.view = { ip: '', geo: null, phase: 'loading' };
    render();
    try {
      st.me = await getMyConnection();
      st.mePhase = 'ok';
    } catch (e) {
      st.mePhase = 'fail'; st.myGeoPhase = 'fail';
      st.view.phase = 'fail';
      st.err = { key: 'err.conn' };
      render();
      return;
    }
    render();
    try {
      st.myGeo = await getGeo(st.me.ip_addr);
      st.myGeoPhase = 'ok';
      if (!st.view.ip) st.view = { ip: '', geo: st.myGeo, phase: 'ok' };
    } catch (e) {
      st.myGeoPhase = 'fail';
      if (!st.view.ip) st.view.phase = 'fail';
      st.err = { key: 'err.geo', vars: { msg: e.message } };
    }
    render();
  }

  function validIp(s) {
    if (/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/.test(s)) return true;
    return /^[0-9a-fA-F:.]+$/.test(s) && s.includes(':') && s.split('::').length <= 2;
  }

  async function lookup() {
    const ip = $('ipInput').value.trim();
    if (!validIp(ip)) { st.fieldErr = true; render(); return; }
    st.fieldErr = false; st.err = null;
    st.view = { ip, geo: null, phase: 'loading' };
    $('lookupBtn').disabled = true;
    render();
    try {
      st.view.geo = await getGeo(ip);
      st.view.phase = 'ok';
    } catch (e) {
      st.view.phase = 'fail';
      st.err = { key: 'err.geoFor', vars: { ip, msg: e.message } };
    }
    $('lookupBtn').disabled = false;
    render();
    $('geoList').scrollIntoView({ behavior: root.dataset.anim === 'off' ? 'auto' : 'smooth', block: 'center' });
  }

  async function refreshGeo() {
    try {
      if (st.me) st.myGeo = await getGeo(st.me.ip_addr);
      if (st.view.ip && st.view.phase === 'ok') st.view.geo = await getGeo(st.view.ip);
      else if (!st.view.ip && st.myGeo) st.view = { ip: '', geo: st.myGeo, phase: 'ok' };
      render();
    } catch (e) {  }
  }

  function setLang() {
    lang = resolveLang();
    applyStatic();
    syncSettings();
    render();
    refreshGeo();
  }

  let snackTimer;
  function snack(msg) {
    const s = $('snackbar');
    s.textContent = msg; s.classList.add('show');
    clearTimeout(snackTimer);
    snackTimer = setTimeout(() => s.classList.remove('show'), 2500);
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.append(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    const ip = $('ip');
    ip.classList.remove('swap'); void ip.offsetWidth; ip.classList.add('swap');
    snack(t('copied'));
  }

  document.addEventListener('pointerdown', ev => {
    if (root.dataset.anim === 'off') return;
    const b = ev.target.closest('.btn, .icon-btn');
    if (!b || b.disabled) return;
    const r = b.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2;
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.cssText = `width:${size}px;height:${size}px;left:${ev.clientX - r.left - size / 2}px;top:${ev.clientY - r.top - size / 2}px`;
    b.append(s);
    s.addEventListener('animationend', () => s.remove());
    setTimeout(() => s.remove(), 800);
  });

  document.querySelectorAll('main .card').forEach((c, i) => c.style.setProperty('--i', i));
  buildSettings();
  lang = resolveLang();
  applyStatic();
  applyLook();
  applyTheme();
  syncSettings();

  $('copyBtn').addEventListener('click', () => st.me && copyText(st.me.ip_addr));
  $('refreshBtn').addEventListener('click', load);
  $('lookupBtn').addEventListener('click', lookup);
  $('ipInput').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
  $('themeBtn').addEventListener('click', () => setPref('theme', resolveTheme() === 'dark' ? 'light' : 'dark'));
  $('settingsBtn').addEventListener('click', openDlg);
  $('closeSettings').addEventListener('click', closeDlg);
  $('resetBtn').addEventListener('click', resetPrefs);
  dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });
  dlg.addEventListener('cancel', e => { e.preventDefault(); closeDlg(); });

  load();
})();
</script>
</body>
</html>
